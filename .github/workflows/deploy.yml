name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual re-deploy from the Actions tab without a new commit.
  workflow_dispatch:

# GITHUB_TOKEN needs pages:write to publish and id-token:write for the deploy attestation.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        # Turns on basePath/assetPrefix for the /portfolio-site subpath.
        env:
          GITHUB_PAGES: "true"
        run: npx next build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
